name: .NET

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
        
          - name: Clase 4 MVC - Tarea
            solution: Tareas/Clase4-MVC-Practica/ClaseMVC.slnx

          - name: Clase 4 MVC - En clase
            solution: EnClase/Clase4-MVC/ClaseMVC.slnx

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore "${{ matrix.solution }}"

      - name: Build
        run: dotnet build "${{ matrix.solution }}" --configuration Release --no-restore

      - name: Test
        run: dotnet test "${{ matrix.solution }}" --configuration Release --no-build --verbosity normal
